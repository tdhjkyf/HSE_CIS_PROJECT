services:
  db:
    image: postgres:15-alpine
    container_name: project_02-db
    environment:
      POSTGRES_DB: "notes_db_02"
      POSTGRES_USER: "notes_user_02"
      POSTGRES_PASSWORD: "password123"
    volumes:
      - pgdata_02:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5402:5432"
    networks:
      - project_02-network

  backend:
    build:
      context: ./backend
    container_name: project_02-backend
    environment:
      DB_HOST: db
      DB_NAME: "notes_db_02"
      DB_USER: "notes_user_02"
      DB_PASS: "password123"
    ports:
      - "5002:5000"
    depends_on:
      - db
    networks:
      - project_02-network

  nginx:
    image: nginx:alpine
    container_name: project_02-nginx
    ports:
      - "8002:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - project_02-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: project_02-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata_02:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9002:9090"
    depends_on:
      - backend
    networks:
      - project_02-network

  grafana:
    image: grafana/grafana:10.0.0
    container_name: project_02-grafana
    ports:
      - "3002:3000"
    volumes:
      - grafanadata_02:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - project_02-network

volumes:
  pgdata_02:
  promdata_02:
  grafanadata_02:

networks:
  project_02-network:
    name: project_02-network